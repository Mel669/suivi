<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<title>Suivi de prospection · Permea</title>
<style>
/* Gabarit public : AUCUNE donnée client ici. Les chiffres arrivent chiffrés (AES-GCM),
   la clé est dans le lien (#k=…), jamais envoyée au serveur. */
:root {
  color-scheme: light;
  --plane: #f5f3ee;
  --surface: #fcfcfb;
  --ink: #1b1a18;
  --ink-2: #52514e;
  --muted: #6c6a65;
  --grid: #e4e2da;
  --track: #ebe9e2;
  --hair: rgba(11, 11, 11, 0.09);
  --accent: #0f6b63;
  --accent-wash: #e3f0ec;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --good: #0ca30c;
  --good-ink: #006300;
  --warn: #fab219;
  --warn-ink: #8a5a00;
  --crit: #d03b3b;
  --crit-ink: #b42727;
  --test: #fff3cd;
  --test-ink: #6b4e00;
  --ombre: 0 1px 2px rgba(30, 25, 15, 0.04), 0 4px 18px rgba(30, 25, 15, 0.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --plane: #0f0f0e;
    --surface: #1a1a19;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #a19f97;
    --grid: #2c2c2a;
    --track: #2b2b29;
    --hair: rgba(255, 255, 255, 0.09);
    --accent: #5fc2b3;
    --accent-wash: #16302c;
    --s1: #3987e5;
    --s2: #d95926;
    --s3: #199e70;
    --good-ink: #0ca30c;
    --warn-ink: #fab219;
    --crit-ink: #e66767;
    --test: #3a3218;
    --test-ink: #f3d98a;
    --ombre: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --plane: #0f0f0e; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #a19f97;
  --grid: #2c2c2a; --track: #2b2b29; --hair: rgba(255, 255, 255, 0.09);
  --accent: #5fc2b3; --accent-wash: #16302c; --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --good-ink: #0ca30c; --warn-ink: #fab219; --crit-ink: #e66767; --test: #3a3218; --test-ink: #f3d98a; --ombre: none;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--plane); color: var(--ink);
  font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
main { max-width: 980px; margin: 0 auto; padding: 28px 16px 48px; }
@media (min-width: 720px) { main { padding: 44px 32px 64px; } }
h1, h2, h3 { line-height: 1.25; margin: 0; }
p { margin: 0; }
.carte {
  background: var(--surface); border: 1px solid var(--hair); border-radius: 16px;
  box-shadow: var(--ombre); padding: 20px; margin-top: 16px;
}
@media (min-width: 720px) { .carte { padding: 26px 28px; } }
.section-titre { font-size: 1.15rem; font-weight: 650; letter-spacing: -0.01em; }
.section-intro { color: var(--ink-2); margin-top: 6px; max-width: 62ch; }

/* En-tête */
.tete { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; }
.sur { font-size: 0.8rem; font-weight: 650; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.tete h1 { font-size: clamp(1.55rem, 4.2vw, 2.15rem); font-weight: 700; letter-spacing: -0.02em; margin-top: 6px; }
.maj { color: var(--ink-2); margin-top: 8px; font-size: 0.95rem; }
.bouton {
  font: inherit; font-size: 0.9rem; font-weight: 600; color: var(--ink); background: var(--surface);
  border: 1px solid var(--hair); border-radius: 999px; padding: 9px 16px; cursor: pointer;
}
.bouton:hover { background: var(--accent-wash); }
.bouton:focus-visible, [tabindex]:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.bandeau-test {
  background: var(--test); color: var(--test-ink); border-radius: 12px; padding: 10px 14px;
  font-weight: 600; font-size: 0.92rem; margin-bottom: 16px;
}

/* En bref */
.bref { background: var(--accent-wash); border: 0; box-shadow: none; }
.bref .lbl { color: var(--accent); }
.bref p.texte { font-size: 1.08rem; margin-top: 6px; max-width: 70ch; }

.lbl { font-size: 0.86rem; font-weight: 600; color: var(--ink-2); }
.petit { font-size: 0.86rem; color: var(--muted); }

/* Chiffre principal */
.hero { display: grid; gap: 22px; }
@media (min-width: 760px) { .hero { grid-template-columns: 1fr 1.2fr; align-items: center; gap: 32px; } }
.hero-v { font-size: clamp(3rem, 9vw, 4.2rem); font-weight: 700; letter-spacing: -0.03em; line-height: 1; margin-top: 8px; }
.hero-v .sur-total { font-size: 1.15rem; font-weight: 600; color: var(--ink-2); letter-spacing: 0; margin-left: 6px; }
.jauge { height: 12px; background: var(--track); border-radius: 999px; margin-top: 14px; overflow: hidden; }
.jauge > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; min-width: 4px; }
.hero-s { color: var(--ink-2); margin-top: 8px; font-size: 0.95rem; }

.tuiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tuile { background: var(--plane); border-radius: 12px; padding: 14px 14px 12px; }
:root[data-theme="dark"] .tuile { background: #222220; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tuile { background: #222220; } }
.tuile .v { font-size: 1.9rem; font-weight: 700; letter-spacing: -0.02em; margin-top: 2px; }
.tuile .d { font-size: 0.82rem; color: var(--muted); margin-top: 2px; }

/* Santé de l'envoi */
.sante { display: grid; gap: 12px; margin-top: 14px; }
@media (min-width: 720px) { .sante { grid-template-columns: 1fr 1fr; } }
.etat { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--hair); border-radius: 12px; }
.etat svg { flex: none; margin-top: 3px; }
.etat .t { font-weight: 650; }
.etat .s { font-size: 0.88rem; color: var(--ink-2); }
.attente { color: var(--muted); }
.vide { margin-top: 14px; padding: 14px 16px; border: 1px dashed var(--grid); border-radius: 12px; color: var(--ink-2); }
.ok { color: var(--good-ink); } .vig { color: var(--warn-ink); } .alerte { color: var(--crit-ink); }

/* Listes */
.listes { display: grid; gap: 14px; margin-top: 18px; }
.liste { border: 1px solid var(--hair); border-radius: 14px; padding: 16px; }
.liste-tete { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.pastille { width: 12px; height: 12px; border-radius: 4px; flex: none; transform: translateY(1px); }
.liste-nom { font-weight: 650; font-size: 1.02rem; }
.liste-qui { color: var(--ink-2); font-size: 0.9rem; margin-top: 4px; }
.barre-ligne { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
.barre { position: relative; flex: 1; height: 10px; background: var(--track); border-radius: 999px; }
.barre > span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; min-width: 3px; }
.barre > span.plein { border-radius: 999px; }
.barre-val { font-size: 0.88rem; color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chiffres { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; margin: 14px 0 0; }
@media (min-width: 720px) { .chiffres { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
.chiffres dt { font-size: 0.8rem; color: var(--muted); }
.chiffres dd { margin: 0; font-weight: 650; font-size: 1.1rem; }
.chiffres dd.discret { font-weight: 500; font-size: 0.92rem; color: var(--ink-2); }
.verdict { margin-top: 16px; padding: 12px 14px; border-left: 3px solid var(--accent); background: var(--accent-wash); border-radius: 0 10px 10px 0; }

/* Semaine par semaine */
.tableau-wrap { overflow-x: auto; margin-top: 14px; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 0.93rem; }
th, td { padding: 9px 10px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
thead th { font-size: 0.78rem; color: var(--muted); font-weight: 600; }
tfoot td { font-weight: 700; border-bottom: 0; }
th:first-child, td:first-child { position: sticky; left: 0; background: var(--surface); z-index: 1; }
.glisser { display: none; font-size: 0.8rem; color: var(--muted); margin-top: 8px; }
@media (max-width: 719px) { .glisser { display: block; } }
.graphe { margin-top: 18px; }
.graphe svg { display: block; width: 100%; height: auto; overflow: visible; }

/* Valeur */
.valeur { display: grid; gap: 16px; margin-top: 14px; }
@media (min-width: 720px) { .valeur { grid-template-columns: 1fr 1fr; } }
.cadre { border: 1px solid var(--hair); border-radius: 14px; padding: 16px; }
.gros { font-size: 1.9rem; font-weight: 700; letter-spacing: -0.02em; margin-top: 2px; }
.marge { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.marge input {
  width: 5.2em; font: inherit; font-weight: 650; padding: 6px 8px; border-radius: 8px;
  border: 1px solid var(--hair); background: var(--plane); color: var(--ink); text-align: right;
}

/* Version simple (10/11, demande du client : « plus simple et lisible ») */
.etat-envois { border-left: 5px solid var(--accent); }
.etat-envois.pause { border-left-color: var(--warn); background: #fdf6e8; }
.etat-titre { font-size: 1.3rem; font-weight: 700; margin-top: 4px; line-height: 1.3; }
.etat-envois .texte { margin-top: 8px; color: var(--ink-2); }
.trois { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; margin-top: 14px; }
@media (max-width: 640px) { .trois { grid-template-columns: 1fr; gap: 16px; } }
.trois .hero-v { font-size: clamp(2.6rem, 7vw, 3.6rem); }
.ligne-fine { margin-top: 16px; color: var(--muted); font-size: 0.92rem; }
.detail-titre { margin: 30px 0 0; font-size: 0.95rem; color: var(--muted); font-weight: 600; }
details.detail { padding-top: 14px; padding-bottom: 14px; }
details.detail > summary { cursor: pointer; font-weight: 650; font-size: 1.02rem; list-style: none; }
details.detail > summary::-webkit-details-marker { display: none; }
details.detail > summary::before { content: "▸"; display: inline-block; width: 1.1em; color: var(--muted); transition: transform .15s; }
details.detail[open] > summary::before { transform: rotate(90deg); }
details.detail[open] > summary { margin-bottom: 10px; }

/* Notes */
.notes { margin: 12px 0 0; padding-left: 1.1em; color: var(--ink-2); }
.notes li { margin: 6px 0; }
.pied { margin-top: 26px; color: var(--muted); font-size: 0.84rem; display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: space-between; }

/* Info-bulle */
.bulle {
  position: fixed; z-index: 10; pointer-events: none; background: var(--ink); color: var(--surface);
  font-size: 0.82rem; padding: 6px 9px; border-radius: 8px; max-width: 240px; opacity: 0; transition: opacity .12s;
}
.bulle.vue { opacity: 1; }
.imprime-seul { display: none; }

/* Verrou */
.verrou { max-width: 520px; margin: 12vh auto 0; text-align: center; }
.verrou h1 { font-size: 1.4rem; margin-top: 14px; }
.verrou p { color: var(--ink-2); margin-top: 10px; }

@media print {
  @page { size: A4; margin: 10mm 12mm; }
  html, body { background: #fff; font-size: 11px; }
  main { padding: 0 1.2mm; max-width: none; width: auto; }
  .marge, #marge-res { display: none !important; }
  .imprime-seul { display: block !important; }
  .carte { box-shadow: none; break-inside: auto; margin-top: 6px; padding: 10px 14px; border-radius: 10px; }
  .bref p.texte { font-size: 11.5px; margin-top: 3px; }
  .tete { gap: 4px; }
  .maj { margin-top: 4px; }
  .liste, .cadre, .etat, .tuile, .graphe, table, .verdict, .bref { break-inside: avoid; }
  .section-titre { break-after: avoid; font-size: 13px; }
  .tete h1 { font-size: 21px; }
  .sur { font-size: 9.5px; }
  .hero { grid-template-columns: 1fr 1.25fr !important; gap: 18px; align-items: center; margin-top: 8px !important; }
  .hero-v { font-size: 40px; }
  .tuiles { gap: 8px; }
  .tuile { padding: 9px 10px 8px; }
  .tuile .v { font-size: 19px; }
  .sante, .valeur { grid-template-columns: 1fr 1fr !important; gap: 8px; margin-top: 10px; }
  .listes { gap: 8px; margin-top: 10px; }
  .liste { padding: 10px 12px; }
  .chiffres { grid-template-columns: repeat(5, minmax(0, 1fr)) !important; margin-top: 8px; }
  .chiffres dd { font-size: 13px; }
  .gros { font-size: 20px; }
  .notes li { margin: 2px 0; }
  .notes { margin-top: 6px; }
  .graphe { margin-top: 8px; }
  .graphe svg { width: 62%; margin: 0 auto; }
  .pied { margin-top: 8px; font-size: 9px; break-before: avoid; }
  .section-intro { margin-top: 3px; }
  .liste-qui { font-size: 10px; margin-top: 2px; }
  .barre-ligne { margin-top: 7px; }
  th, td { padding: 6px 8px; }
  .glisser, .bouton, .bulle { display: none !important; }
  th:first-child, td:first-child { position: static; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<script>
(function () {
  'use strict';
  var NOMS_SLOTS = ['--s1', '--s2', '--s3'];
  var CHAMPS = ['contactees', 'messages', 'rebonds', 'reponses', 'positives', 'rdv', 'desinscriptions'];
  var nf = new Intl.NumberFormat('fr-FR');
  var nf1 = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 1 });
  var eur = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 0 });
  var NBSP = ' ', NNBSP = ' ';

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function n(x) { return nf.format(x || 0); }
  function pct(a, b) { return b ? nf1.format(100 * a / b) + NNBSP + '%' : '–'; }
  function euros(x) { return eur.format(Math.round(x || 0)) + NNBSP + '€'; }
  function b64u(s) {
    s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '=';

  function brancherBulles() {
    var b = document.getElementById('bulle');
    function montrer(el, x, y) { b.textContent = el.getAttribute('data-bulle'); b.classList.add('vue'); placer(x, y); }
    function placer(x, y) { var w = b.offsetWidth, hh = b.offsetHeight; b.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, x - w / 2)) + 'px'; b.style.top = Math.max(8, y - hh - 12) + 'px'; }
    function cacher() { b.classList.remove('vue'); }
    document.querySelectorAll('[data-bulle]').forEach(function (el) {
      el.addEventListener('mousemove', function (e) { montrer(el, e.clientX, e.clientY); });
      el.addEventListener('mouseleave', cacher);
      el.addEventListener('focus', function () { var r = el.getBoundingClientRect(); montrer(el, r.left + r.width / 2, r.top); });
      el.addEventListener('blur', cacher);
    });
  }

  window.addEventListener('hashchange', ouvrir);
  ouvrir();
})();
</script>
</body>
